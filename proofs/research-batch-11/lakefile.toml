name = "researchBatch11"
version = "0.1.0"
defaultTargets = ["Results"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "c44e0c8ee63ca166450922a373c7409c5d26b00b"

[[lean_lib]]
name = "Results"
roots = [
  "DiagonalArithmetic",
  "DiagonalNewton",
  "DisjointCouples",
  "DyadicChainCut",
  "GreedyLargestRows",
  "JosephusSignedCollision",
  "KleinTwist",
  "NeighborDivisorSquares",
  "ShenFragmentation"
]
